[theme]
base = "light"

# Michigan Blue on white for readable forms; Maize is an accent.
# Source: https://brand.umich.edu/design-resources/colors/
primaryColor = "#00274C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#00274C"
linkColor = "#00274C"

# University of Michigan supporting colors used by native status elements.
redColor = "#9A3324"
orangeColor = "#D86018"
yellowColor = "#FFCB05"
greenColor = "#75988D"
blueColor = "#2F65A7"

yellowTextColor = "#00274C"
greenTextColor = "#00274C"

chartCategoricalColors = [
  "#00274C",
  "#FFCB05",
  "#2F65A7",
  "#00B2A9",
  "#75988D",
  "#D86018",
  "#9A3324",
  "#A5A508",
]

dataframeHeaderBackgroundColor = "#FFCB05"
dataframeHeaderTextColor = "#00274C"
codeBackgroundColor = "#F5F5F5"
borderColor = "#989C97"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
