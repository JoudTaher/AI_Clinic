[theme]
base = "dark"

# University of Michigan signature colors. Michigan Blue is the application
# surface; Maize is reserved for high-visibility accents and links.
primaryColor = "#2F65A7"
backgroundColor = "#00274C"
secondaryBackgroundColor = "#12355B"
textColor = "#FFFFFF"
linkColor = "#FFCB05"

# University of Michigan supporting colors used by native status elements.
redColor = "#9A3324"
orangeColor = "#D86018"
yellowColor = "#FFCB05"
greenColor = "#75988D"
blueColor = "#2F65A7"

yellowTextColor = "#00274C"
greenTextColor = "#00274C"

chartCategoricalColors = [
  "#00274C",
  "#FFCB05",
  "#2F65A7",
  "#00B2A9",
  "#75988D",
  "#D86018",
  "#9A3324",
  "#A5A508",
]

dataframeHeaderBackgroundColor = "#FFCB05"
dataframeHeaderTextColor = "#00274C"
codeBackgroundColor = "#12355B"
borderColor = "#75988D"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
